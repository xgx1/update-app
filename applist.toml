# update-app 配置文件（Arch Linux 版，2026-08-28 由 Windows 版适配）
# 本文件记录「需要更新什么」。update-app 读取它执行更新，并把结果写入 logs/latest.json + logs/latest.log。

[general]
# 日志/结果目录（相对本文件所在目录）
log_dir = "logs"
# self 自更新的发布产物目录（相对本文件所在目录）
bin_dir = "bin"
# 单项更新超时（秒）：本机含 pacman/yay 系统级更新，给足 30 分钟
timeout_seconds = 1800

# ---------------------------------------------------------------------------
# 1. 系统/AUR 软件包：Arch 无 scoop，本段保持关闭（update_all=false + 空 apps = 无任务 no-op）。
#    真实系统更新通过下方 [source] 的自定义命令项执行（pacman 系统更新 / yay AUR 更新）。
# ---------------------------------------------------------------------------
[scoop]
update_all = false
apps = []

# ---------------------------------------------------------------------------
# 2. 源码型项目：记录本地源码目录，基于该目录更新（默认 git pull --ff-only；
#    自定义 command 则完全替代默认命令，适合 pacman/yay 这类「非 git」更新项）
# ---------------------------------------------------------------------------
[source]

[[source.projects]]
name = "update-app"
path = "/home/sx/projects/MyAI/update-app"

# 系统更新：pacman -Syu（sudo 本机免密可用）。path 只作为锚点目录（CLI 校验须存在）。
# 注意：非交互环境 --noconfirm 跳过确认；想人工确认就在终端手动 sudo pacman -Syu
[[source.projects]]
name = "pacman 系统更新"
path = "/var/cache/pacman/pkg"
command = "sudo pacman -Syu --noconfirm"

# AUR 更新：yay -Sua（只更新 -A 装的 AUR 包，不动仓库包；--noconfirm 跳过交互确认）
[[source.projects]]
name = "yay AUR 更新"
path = "/home/sx/.cache/yay"
command = "yay -Sua --noconfirm"

# ── 2026-09-12 纳入：工作区里其余「有上游」的源码仓库 ────────────────────────
# 此前不在覆盖内，需人工 pull；纳入后一次 run 全覆盖。
# 注意：/home/sx/projects/MyAI/{deepseek-harness,update-app} 不加——
# deepseek-harness（分支 master）是 DSH 自身的唯一检出、且就是生产实例（3080）本身，
# 目录于 2026-09-13 由 master/ 改名而来、dev worktree/3081 同日下线；升级要走
# 「源码升级→隔离冒烟验证→重建→用户确认后重启」，见 ~/.dsh/skills/update-all
# 「DSH harness 大版本升级」节与 deepseek-harness/.agents/skills/dsh-deploy-master，
# 自动 pull 会打挂生产；update-app 自身走 self 自更新、无 upstream，pull 必失败。
[[source.projects]]
name = "rider-skills"
path = "/home/sx/projects/MyAI/dsh-extensions/vendor/rider-skills"

# dsh-context-compression-selector：本地检出已不存在，生产改走 npm registry（0.1.0）。
# 2026-09-13 移除此项——保留会让本项 pull 必然失败。

# deepseek-harness 源码（默认禁用，需要时取消注释并改 enabled = true）
# [[source.projects]]
# name = "deepseek-harness"
# path = "/home/sx/projects/MyAI/deepseek-harness"
# enabled = false

# ---------------------------------------------------------------------------
# 3. 特殊配置更新：DSH 使用的大量插件均为源码安装
#    paths 可以是单个 git 仓库，也可以是包含多个 git 仓库的目录（自动扫描子目录）
# ---------------------------------------------------------------------------
[special]

[[special.items]]
name = "dsh 插件源码"
paths = [
  "/home/sx/projects/MyAI/dsh-extensions",
  # ── 2026-09-12 纳入：web profile 的 link: 运行中插件源码（均含上游，pull 安全）──
  # ⚠️ pull 只刷新源码，不改运行时：这些插件加载的是各自 lib/ 或 dist/ 构建产物，
  #    重建是刻意动作，且必须与 harness 版本匹配（如 dsh-genui 0.10.0 要求 harness ≥0.1.2-rc.1）。
  "/home/sx/projects/MyAI/dsh-extensions/vendor/dsh-genui",
  "/home/sx/projects/MyAI/dsh-extensions/vendor/dsh-toolkit",
  "/home/sx/projects/MyAI/dsh-extensions/vendor/dsh-drop-to-path",
]
# 2026-09-12 复核：web profile 的 link 插件已全部受版本控制——
# dsh-sidebar-taskbar / web-dsh-web-extension / dsh-task-manager 并入本项第一行的 dsh-extensions 仓库；
# 第三方克隆（dsh-genui / dsh-toolkit / dsh-drop-to-path）自 2026-09-13 起也在 dsh-extensions/vendor/ 下。
# dsh-agent-teams 与 MemOS 曾接上各自上游，现均改 npm 交付（MemOS 更已彻底移除），不再需要本地源码。
# 默认对每个路径执行 git pull --ff-only；需要自定义时：
# command = "git -C {path} pull --ff-only"
# 示例：拉完 dsh-extensions 后把技能同步到 ~/.dsh/skills（按需启用；注意 dsh-extensions/skills 目前只有 dsh-extension-dev）
# post_commands = [
#   'rsync -a --delete /home/sx/projects/MyAI/dsh-extensions/skills/ ~/.dsh/skills/'
# ]

# 第三方插件：只做「上游有没有新提交」检测，不动工作区。
# 这些目录被生产以 link: 挂载，自动 pull 会直接改变生产插件行为，所以这里只 fetch + 报告差异；
# 更新流程：权威是 `~/.dsh/profiles/web/package.json` 的 link: 目标——先读它确认现在是哪几个路径，
# 再决定 pull 还是重建（不维护单独的清单文档，避免与现实漂移）。
# 注：MemOS 与 dsh-agent-teams 已于 2026-09-13 改为 npm 交付并删除源码目录，不再参与检测；
#     同日 MemOS 被用户判定不再需要，已从生产 profile 彻底移除（依赖/bundle/patch/数据目录全删）。
[[special.items]]
name = "第三方插件上游检测（只 fetch，不改工作区）"
paths = [
  "/home/sx/projects/MyAI/dsh-extensions/vendor/dsh-genui",
  "/home/sx/projects/MyAI/dsh-extensions/vendor/dsh-toolkit",
  "/home/sx/projects/MyAI/dsh-extensions/vendor/dsh-drop-to-path",
]
command = "git -C {path} fetch -q origin main && n=$(git -C {path} rev-list --count HEAD..origin/main) && if [ \"$n\" = \"0\" ]; then echo '上游无新提交'; else echo \"上游有 $n 个新提交（需人工决定是否更新）：\"; git -C {path} log --oneline HEAD..origin/main | head -20; fi"

# ---------------------------------------------------------------------------
# 4. 已知问题自愈规则：失败输出命中 match（正则）后自动处理
#    命中但无法自动处理/需要拍板的问题 → 标记 needs_input，由技能停下询问用户
#    AI 每次解决新问题后，应把「解决方式」固化成这里的一条规则，下次 CLI 自己就能处理
# ---------------------------------------------------------------------------
[fixes]

# 网络问题：先跳过，由调用方决定稍后重试
[[fixes.rules]]
match = "Could not resolve host|Failed to connect|open git-upload-pack|unable to access"
hint = "网络暂时不可用，跳过；稍后可由用户触发重试（可设代理 http://127.0.0.1:7897）"
skip = true

# pacman 同步失败（镜像/网络）：跳过，稍后重试或换镜像
[[fixes.rules]]
match = "failed to synchronize all databases"
hint = "pacman 同步失败：通常是网络/镜像问题，跳过；稍后重试或 sudo pacman-mirrors -c China 换镜像"
skip = true

# 路径/仓库问题：需要人工确认
[[fixes.rules]]
match = "fatal: not a git repository"
hint = "该目录不是 git 仓库（或路径不对/未 git init），需要人工确认路径"
ask_user = true

# git 合并冲突：需要人工解决
[[fixes.rules]]
match = "CONFLICT \\(content\\)|Merge conflict|Automatic merge failed"
hint = "git 存在合并冲突，需要人工解决后重试"
ask_user = true

# 本地有未提交修改（开发中 WIP）：绝不能自动丢弃，停下询问
# 覆盖 git 两种文案：rebase 拉取（cannot pull with rebase...）与 merge 拉取（would be overwritten by merge / Please commit...）
[[fixes.rules]]
match = "cannot pull with rebase: You have unstaged changes|Your local changes (to the following files )?would be overwritten|Please commit (your changes )?or stash them"
hint = "仓库有本地未提交修改（可能是 WIP）：需要确认是 stash/commit 后重试，还是跳过本次更新（先看 git status）"
ask_user = true

# pacman 数据库锁残留：自动清锁重试（先确认没有 pacman 进程在跑，否则不动锁）
[[fixes.rules]]
match = "unable to lock database|database is locked|failed to init transaction"
hint = "pacman 数据库锁残留：确认无 pacman/yay 进程运行后清锁重试"
command = "if pgrep -x pacman >/dev/null || pgrep -f 'makepkg|yay' >/dev/null; then echo 'pacman/yay 仍在运行，跳过清锁'; exit 1; fi; sudo rm -f /var/lib/pacman/db.lck"

# pacman keyring 过期（PGP 签名校验失败）：需要联网刷 keyring，让用户/AI 处理
[[fixes.rules]]
match = "invalid or corrupted package \\(PGP signature\\)|failed to commit transaction"
hint = "pacman keyring 过期：sudo pacman -Sy archlinux-keyring 或 sudo pacman-key --refresh-keys 后重试（可能耗时/需网络）"
ask_user = true

# DSH vendor 插件依赖悬空（自开发检出改名/移动导致）：
# 症状 = dsh-web 进 systemd 崩溃重启循环，日志有 `plugin tree failed to load` /
# `Cannot find package '@deepseek-ai/...' imported from .../dsh-extensions/vendor/...`
# （2026-09-13 master/ → deepseek-harness/ 改名后，vendor/dsh-toolkit 内 23 条绝对符号链接悬空）。
# 预防与完整处置见技能 update-all「vendor 悬空链接重指」节。
# 修复：把 dsh-extensions 下悬空的绝对符号链接按剩余路径重指到当前 worktree，再重试一次。
[[fixes.rules]]
match = "plugin tree failed to load|Cannot find package '@deepseek-ai/.*imported from .*dsh-extensions"
hint = "dsh-extensions/vendor 插件依赖悬空（自开发检出改名/移动过）：已重指到当前 deepseek-harness；重启 dsh-web.service 后生效"
command = 'find /home/sx/projects/MyAI/dsh-extensions -xtype l -print0 | while IFS= read -r -d "" l; do t=$(readlink "$l") || continue; case "$t" in /home/sx/projects/MyAI/*/*) rest=${t#/home/sx/projects/MyAI/}; rest=${rest#*/}; [ -e "/home/sx/projects/MyAI/deepseek-harness/$rest" ] && ln -sfn "/home/sx/projects/MyAI/deepseek-harness/$rest" "$l" && echo "relinked: $l";; esac; done; true'
retry = true