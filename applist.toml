# update-app 配置文件（Arch Linux 版）—— 本文件只存在于 linux 分支
# 分支模型（2026-10-15）：main = 通用部分（CLI/技能/文档，无 applist.toml）；
# windows / linux = main + 各自这份配置。改通用部分在 main 上改，再 `git merge main` 进本分支。
# （旧副本 applist.arch-linux.toml 已删除——那份配置就是本文件。）
# 本文件记录「需要更新什么」。update-app 读取它执行更新，并把结果写入 logs/latest.json + logs/latest.log。

[general]
# 日志/结果目录（相对本文件所在目录）
log_dir = "logs"
# self 自更新的发布产物目录（相对本文件所在目录）
bin_dir = "bin"
# 单项更新超时（秒）：本机含 pacman/yay 系统级更新，给足 30 分钟
timeout_seconds = 1800

# ---------------------------------------------------------------------------
# 1. 系统/AUR 软件包：Arch 无 scoop，本段保持关闭（update_all=false + 空 apps = 无任务 no-op）。
#    真实系统更新通过下方 [source] 的自定义命令项执行（pacman 系统更新 / yay AUR 更新）。
# ---------------------------------------------------------------------------
[scoop]
update_all = false
apps = []

# ---------------------------------------------------------------------------
# 2. 源码型项目：记录本地源码目录，基于该目录更新（默认 git pull --ff-only；
#    自定义 command 则完全替代默认命令，适合 pacman/yay 这类「非 git」更新项）
# ---------------------------------------------------------------------------
[source]

[[source.projects]]
name = "update-app"
path = "/home/sx/projects/update-app"

# 系统更新：pacman -Syu（sudo 本机免密可用）。path 只作为锚点目录（CLI 校验须存在）。
# 注意：非交互环境 --noconfirm 跳过确认；想人工确认就在终端手动 sudo pacman -Syu
[[source.projects]]
name = "pacman 系统更新"
path = "/var/cache/pacman/pkg"
command = "sudo pacman -Syu --noconfirm"

# AUR 更新：yay -Sua（只更新 -A 装的 AUR 包，不动仓库包；--noconfirm 跳过交互确认）
[[source.projects]]
name = "yay AUR 更新"
path = "/home/sx/.cache/yay"
command = "yay -Sua --noconfirm"
# 2026-10-14 加：AUR 换的只是磁盘文件，运行中的 GUI/常驻进程仍旧代码——clash-verge 升级后
# 会一直显示旧版本直到下次登录（pacman 脚本明写要重启）。后置脚本按「二进制 mtime 晚于
# 进程启动时间」判定陈旧并重启（rayburst/motrix-next 单元、clash-verge GUI、特权服务）。
post_commands = ["bash /home/sx/projects/update-app/scripts/post-aur-restart.sh"]

# ── 2026-09-26 纳入：uv 工具（pacman/yay 都管不到，只能走 uv tool upgrade）────
# 本机常驻组件，此前不在覆盖内 → 长期只能手动更新：
#   codebase-memory-mcp：cbm 知识图谱 MCP 的引擎（常驻 daemon + UI :9749）
# ⚠️ codebase-memory-mcp 自带的 `update` 子命令对 uv/pip 安装的副本无效
#    （原样回一句 "This PyPI copy is maintained by pip"），必须用 uv tool upgrade。
# ⚠️ CBM 引擎换代后常驻 daemon 还握着旧 inode，必须连带重启 codebase-memory.service（AGENTS.md 红线）。
# 2026-10-05 移除：headroom-ai (uv tool) 项。headroom 中转层已于 2026-10-03 整体拆除
#    （~/.dsh/settings.yaml「直连官方，headroom 中转层 2026-10-03 拆除，不再覆盖 baseURL」），
#    二进制 ~/.local/bin/headroom 与 ~/.local/share/uv/tools/headroom-ai 均不存在，headroom-*.service 全删。
#    保留该项只会每次 run 命中「路径不存在」假失败。模型链路现已直连官方，无代理层可更。
[[source.projects]]
name = "codebase-memory-mcp (uv tool)"
path = "/home/sx/.local/share/uv/tools/codebase-memory-mcp"
command = "/home/sx/.local/bin/uv tool upgrade codebase-memory-mcp && systemctl --user restart codebase-memory.service"

# ── 2026-09-12 纳入：工作区里其余「有上游」的源码仓库 ────────────────────────
# 此前不在覆盖内，需人工 pull；纳入后一次 run 全覆盖。
# 注意：/home/sx/projects/MyAI/{deepseek-harness,deepseek-harness-dev,update-app} 不加——
# deepseek-harness（分支 master）是 DSH 自身的生产检出、就是生产实例（3080）本身，
# 目录于 2026-09-13 由 master/ 改名而来；升级要走「源码升级→隔离冒烟验证→重建→用户确认后
# 重启」，见 ~/.dsh/skills/update-all「DSH harness 大版本升级」节与
# deepseek-harness/.agents/skills/dsh-deploy-master，自动 pull 会打挂生产。
# deepseek-harness-dev（分支 dev）是 2026-09-27 重新上线的开发 worktree（由
# dsh-web-dev.service 跑在 :3081、DSH_HOME=~/.dsh-dev），它是开发中的工作区，
# 自动 pull 会打断正在进行的开发 → 同样不纳入，需要时手动 pull。
# （这两条 2026-09-30 更正：此前注释写「dev worktree/3081 已于 2026-09-13 下线」，已过时。）
# update-app 自身走 self 自更新、无 upstream，pull 必失败。
# rider-skills：本地克隆已于 2026-09-13 删除（无运行时消费者——它的 6 个技能在
# ~/.dsh/skills/ 里是改名副本，不经此仓库加载）。需要时重新 clone：
#   git clone https://github.com/JetBrains/rider-skills \
#     /home/sx/projects/MyAI/dsh-extensions/vendor/rider-skills

# dsh-context-compression-selector：本地检出已不存在，生产改走 npm registry（0.1.0）。
# 2026-09-13 移除此项——保留会让本项 pull 必然失败。

# deepseek-harness 源码（默认禁用，需要时取消注释并改 enabled = true）
# [[source.projects]]
# name = "deepseek-harness"
# path = "/home/sx/projects/MyAI/deepseek-harness"
# enabled = false

# ---------------------------------------------------------------------------
# 3. 特殊配置更新：DSH 使用的大量插件均为源码安装
#    paths 可以是单个 git 仓库，也可以是包含多个 git 仓库的目录（自动扫描子目录）
# ---------------------------------------------------------------------------
[special]

[[special.items]]
name = "dsh 插件源码"
paths = [
  "/home/sx/projects/MyAI/dsh-extensions",
  # ── 2026-09-12 纳入：web profile 的 link: 运行中插件源码（均含上游，pull 安全）──
  # ⚠️ pull 只刷新源码，不改运行时：这些插件加载的是各自 lib/ 或 dist/ 构建产物，
  #    重建是刻意动作，且必须与 harness 版本匹配（如 dsh-genui 0.11.1-preview.2 要求 harness ≥0.1.6-alpha.1）。
  "/home/sx/projects/MyAI/dsh-extensions/vendor/dsh-genui",
  # 2026-10-05 纳入：billion-context（web profile 的 link: 插件，v0.11.3 起上线；
  #   submodule，本地分支 2026-09-30_compat-dropfields，非 main——pull 走各自跟踪分支即可）。
  "/home/sx/projects/MyAI/dsh-extensions/vendor/billion-context",
]
# 2026-09-12 复核：web profile 的 link 插件已全部受版本控制——
# dsh-sidebar-taskbar / dsh-task-manager 并入本项第一行的 dsh-extensions 仓库；第三方克隆自
# 2026-09-13 起也在 dsh-extensions/vendor/ 下。
# 2026-09-20 修正：移除 dsh-drop-to-path（本地已删除、非 submodule、profile 无引用，保留只会每次 run 假失败）；
#                   加入 dsh-evolve-modes。
# 2026-10-05 复核（生产 web 的 link: 全量，权威 ~/.dsh/profiles/web/package.json）：
#   vendor/{dsh-genui,billion-context} + plugins/{dsh-dracula-theme,dsh-llm-retry-schedule,
#   dsh-sidebar-taskbar,dsh-task-manager}。dsh-toolkit 与 dsh-evolve-modes 已从 profile 移除、
#   vendor 下目录与 submodule 登记一并删除（保留配置只报假失败）。dev（~/.dsh-dev）另加
#   plugins/dsh-laya-router（Laya 逐轮模型路由）。plugins/ 下的都在 dsh-extensions 仓库内
#   （本项第一行已覆盖）；vendor/ 下是独立 submodule/克隆，须逐条列出。
#   ⚠️ plugins/dsh-dracula-theme 目前是 dsh-extensions 里的**未跟踪目录**（2026-10-05 观测），
#   上游 xgx1/dsh-extensions 的 main 上还没有它——本项 pull 不会覆盖它，需要时单独提交流程。
# ⚠️ submodule 收尾（2026-09-30 固化）：vendor/ 下是 submodule，fast-forward 后父仓库会
#   出现 `M vendor/dsh-genui` 这类脏指针，**会挡住下一次 git pull --ff-only**（报
#   "Your local changes … would be overwritten"，命中 WIP 规则降级成 needs_input）。
#   每次 run 后按 AGENTS.md 的 submodule 规矩在 dsh-extensions 里补一条指针提交即可。
# dsh-agent-teams 与 MemOS 曾接上各自上游，现均改 npm 交付（MemOS 更已彻底移除），不再需要本地源码。
# 默认对每个路径执行 git pull --ff-only；需要自定义时：
# command = "git -C {path} pull --ff-only"
# 示例：拉完 dsh-extensions 后把技能同步到 ~/.dsh/skills（按需启用；注意 dsh-extensions/skills 目前只有 dsh-extension-dev）
# post_commands = [
#   'rsync -a --delete /home/sx/projects/MyAI/dsh-extensions/skills/ ~/.dsh/skills/'
# ]

# 第三方插件：只做「上游有没有新提交」检测，不动工作区。
# 这些目录被生产以 link: 挂载，自动 pull 会直接改变生产插件行为，所以这里只 fetch + 报告差异；
# 更新流程：权威是 `~/.dsh/profiles/web/package.json` 的 link: 目标——先读它确认现在是哪几个路径，
# 再决定 pull 还是重建（不维护单独的清单文档，避免与现实漂移）。
# 注：MemOS 与 dsh-agent-teams 已于 2026-09-13 改为 npm 交付并删除源码目录，不再参与检测；
#     同日 MemOS 被用户判定不再需要，已从生产 profile 彻底移除（依赖/bundle/patch/数据目录全删）。
[[special.items]]
name = "第三方插件上游检测（只 fetch，不改工作区）"
paths = [
  "/home/sx/projects/MyAI/dsh-extensions/vendor/dsh-genui",
  "/home/sx/projects/MyAI/dsh-extensions/vendor/billion-context",
]
# 2026-10-05：跟踪分支动态取（billion-context 在 2026-09-30_compat-dropfields 上、非 main，
#   硬编码 origin/main 对它报「无法找到远程引用 main」）。命令里刻意不用 @{{upstream}} 与 ${{var#...}}
#   这类带花括号的写法——update-app 的模板会把它当成 {path}/{name} 占位符解析。
command = "b=$(git -C {path} symbolic-ref --quiet --short HEAD) && u=$(git -C {path} config --get branch.$b.merge | sed 's#refs/heads/##') && git -C {path} fetch -q origin && n=$(git -C {path} rev-list --count HEAD..origin/$u) && if [ \"$n\" = \"0\" ]; then echo '上游无新提交'; else echo \"上游 origin/$u 有 $n 个新提交（需人工决定是否更新）：\"; git -C {path} log --oneline HEAD..origin/$u | head -20; fi"

# ---------------------------------------------------------------------------
# 4. 已知问题自愈规则：失败输出命中 match（正则）后自动处理
#    命中但无法自动处理/需要拍板的问题 → 标记 needs_input，由技能停下询问用户
#    AI 每次解决新问题后，应把「解决方式」固化成这里的一条规则，下次 CLI 自己就能处理
# ---------------------------------------------------------------------------
[fixes]

# 网络问题：先跳过，由调用方决定稍后重试
[[fixes.rules]]
match = "Could not resolve host|Failed to connect|open git-upload-pack|unable to access"
hint = "网络暂时不可用，跳过；稍后可由用户触发重试（可设代理 http://127.0.0.1:7897）"
skip = true

# pacman 下载 404（镜像 rebuild 窗口）：某版本在所有镜像都被清掉 = 本地同步库落后于镜像文件树。
# 2026-10-23 实证：haskell-* 全镜像 404，重新 `pacman -Syy` 取到的仍是旧库（db 来源镜像自身滞后）；
# 正解是临时把 db 与文件一致的镜像（geo.mirror.pkgbuild.com）置顶跑 -Syyu，成功后还原 mirrorlist。
# 这一步改动机器级配置，故降级 needs_input，由 AI/用户拍板。
[[fixes.rules]]
match = "无法获取某些文件|无法从 .* 获取文件|The requested URL returned error: 404|failed to retrieve some files"
hint = "镜像 rebuild 窗口：本地同步库落后于镜像文件树，某些版本已被全镜像清掉。处置：备份 /etc/pacman.d/mirrorlist → 把 Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch 置顶 → sudo pacman -Syyu --noconfirm → 成功后还原 mirrorlist；或等镜像收敛后重跑。绝不要 pacman -Sy。"
ask_user = true

# pacman 库锁被占用（另一个 pacman/yay 正在跑）：2026-10-23 实证——用户自己的 yay -Syyu 持锁，
# 本项报文是「failed to synchronize all databases (unable to lock database)」，被下面的网络规则
# 误判成镜像问题、给了错提示。锁被活进程持有 = 系统更新已在别处进行，跳过即可；残留锁才删。
[[fixes.rules]]
match = "unable to lock database|unable to lock the database"
hint = "pacman 库锁被占用：pgrep -x pacman 有活进程（比如用户自己在跑 yay -Syyu）说明系统更新已在进行，本次跳过；确认无进程才是残留锁，删 /var/lib/pacman/db.lck 后重试"
skip = true

# pacman 同步失败（镜像/网络）：跳过，稍后重试或换镜像
[[fixes.rules]]
match = "failed to synchronize all databases"
hint = "pacman 同步失败：通常是网络/镜像问题，跳过；稍后重试或 sudo pacman-mirrors -c China 换镜像"
skip = true

# 路径/仓库问题：需要人工确认
[[fixes.rules]]
match = "fatal: not a git repository"
hint = "该目录不是 git 仓库（或路径不对/未 git init），需要人工确认路径"
ask_user = true

# 配置漂移：applist.toml 里配的路径已不存在（插件被移除/改名/迁走）。
# 2026-09-20 固化：此前这类只报「未命中已知修复规则」→ failed，需要 AI 介入；
# 现在降级为 needs_input，由技能把漂移事实摆给用户拍板（实例：dsh-drop-to-path 已删）。
[[fixes.rules]]
match = "路径不存在"
hint = "配置里的路径已不存在（配置漂移）：核对插件/仓库是否被移除或改名，然后更新 applist.toml 的路径列表（权威是 ~/.dsh/profiles/*/package.json 的 link: 目标）"
ask_user = true

# git 合并冲突：需要人工解决
[[fixes.rules]]
match = "CONFLICT \\(content\\)|Merge conflict|Automatic merge failed"
hint = "git 存在合并冲突，需要人工解决后重试"
ask_user = true

# 本地有未提交修改（开发中 WIP）：绝不能自动丢弃，停下询问
# 覆盖 git 两种文案：rebase 拉取（cannot pull with rebase...）与 merge 拉取（would be overwritten by merge / Please commit...）
[[fixes.rules]]
match = "cannot pull with rebase: You have unstaged changes|Your local changes (to the following files )?would be overwritten|Please commit (your changes )?or stash them"
hint = "仓库有本地未提交修改（可能是 WIP）：需要确认是 stash/commit 后重试，还是跳过本次更新（先看 git status）"
ask_user = true

# 本地分支与远端分叉：`git pull --ff-only` 直接中止（本地有自己的提交，远端也有新提交）。
# 2026-10-14 固化：此前只报「未命中已知修复规则」→ failed。怎么合（merge 还是 rebase、
# 本地提交要不要推）牵涉别人/自己的未推送提交，不该由 CLI 自动决定，故降级为 needs_input。
# 实例：dsh-extensions 本地领先 1（genui 指针 bump）+ 远端领先 3（插件 link: 相对路径）。
[[fixes.rules]]
match = "Not possible to fast-forward, aborting|无法快进|无法在偏离的分支上进行快进"
hint = "本地分支与 origin 分叉（本地有提交、远端也有新提交）：人工选一种合并方式（git merge --no-ff origin/main 或 git rebase origin/main），确认后再跑一次"
ask_user = true

# pacman 数据库锁残留：自动清锁重试（先确认没有 pacman 进程在跑，否则不动锁）
[[fixes.rules]]
match = "unable to lock database|database is locked|failed to init transaction"
hint = "pacman 数据库锁残留：确认无 pacman/yay 进程运行后清锁重试"
command = "if pgrep -x pacman >/dev/null || pgrep -f 'makepkg|yay' >/dev/null; then echo 'pacman/yay 仍在运行，跳过清锁'; exit 1; fi; sudo rm -f /var/lib/pacman/db.lck"

# pacman keyring 过期（PGP 签名校验失败）：需要联网刷 keyring，让用户/AI 处理
[[fixes.rules]]
match = "invalid or corrupted package \\(PGP signature\\)|failed to commit transaction"
hint = "pacman keyring 过期：sudo pacman -Sy archlinux-keyring 或 sudo pacman-key --refresh-keys 后重试（可能耗时/需网络）"
ask_user = true

# DSH vendor 插件依赖悬空（自开发检出改名/移动导致）：
# 症状 = dsh-web 进 systemd 崩溃重启循环，日志有 `plugin tree failed to load` /
# `Cannot find package '@deepseek-ai/...' imported from .../dsh-extensions/vendor/...`
# （2026-09-13 master/ → deepseek-harness/ 改名后，vendor/dsh-toolkit 内 23 条绝对符号链接悬空）。
# 预防与完整处置见技能 update-all「vendor 悬空链接重指」节。
# 修复：把 dsh-extensions 下悬空的绝对符号链接按剩余路径重指到当前 worktree，再重试一次。
[[fixes.rules]]
match = "plugin tree failed to load|Cannot find package '@deepseek-ai/.*imported from .*dsh-extensions"
hint = "dsh-extensions/vendor 插件依赖悬空（自开发检出改名/移动过）：已重指到当前 deepseek-harness；重启 dsh-web.service 后生效"
command = 'find /home/sx/projects/MyAI/dsh-extensions -xtype l -print0 | while IFS= read -r -d "" l; do t=$(readlink "$l") || continue; case "$t" in /home/sx/projects/MyAI/*/*) rest=${t#/home/sx/projects/MyAI/}; rest=${rest#*/}; [ -e "/home/sx/projects/MyAI/deepseek-harness/$rest" ] && ln -sfn "/home/sx/projects/MyAI/deepseek-harness/$rest" "$l" && echo "relinked: $l";; esac; done; true'
retry = true

# AUR 包装领先上游：PKGBUILD 指向的 release 资产还不存在（下载 404）。
# 2026-09-26 实例（本次唯一失败项）：cua-driver-bin 0.29.0 的 source URL
#   .../releases/download/cua-driver-rs-v0.29.0/cua-driver-rs-0.29.0-linux-x86_64-binary.tar.gz
# 返回 404。核实结论：上游 trycua/cua 有 cua-driver-rs-v0.29.0 这个 tag，但**没有对应 release
# 对象/资产**（GitHub API releases/tags 返回 Not Found；有资产的最新稳定版是 cua-driver-rs-v0.28.3），
# 即 AUR 维护者先改了 pkgver、上游资产还没发出来（AUR 最后修改就在发版当天）。
# 本地无可修：yay 每次都会重新下载 PKGBUILD，改 ~/.cache/yay 里的副本不持久，
# 也不该为此把包塞进 IgnorePkg（那会长期钉死版本）。→ 命中即跳过，保留已装版本；
# 上游补发资产后下载成功，规则自然不再命中，无需人工清理。
[[fixes.rules]]
match = "无法下载 https://github\\.com/trycua/cua/releases/download/cua-driver-rs-v|releases/download/cua-driver-rs-v[0-9.]+/cua-driver-rs-[0-9.]+-linux-x86_64-binary\\.tar\\.gz"
hint = "cua-driver-bin 的 PKGBUILD 领先上游（该版本 release 资产尚未发布，404）：本次保留已装版本，等上游发版后重跑即可自动恢复"
skip = true